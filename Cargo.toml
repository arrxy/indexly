[package]
name = "indexly"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A disk-backed BM25 search engine with compressed posting lists and parallel indexing"
repository = "https://github.com/arrxy/indexly"
homepage = "https://github.com/arrxy/indexly"
readme = "README.md"
keywords = ["search", "bm25", "inverted-index", "compression", "indexing"]
categories = ["text-processing", "data-structures", "command-line-utilities"]
default-run = "search-engine"
autobins = false
include = ["src/**", "tests/**", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
metal-radix = { version = "0.1.0", optional = true }

[features]
default = []
gpu-sort = ["dep:metal-radix"]

[[bin]]
name = "search-engine"
path = "src/main.rs"

[[bin]]
name = "search"
path = "src/bin/search.rs"

[[bin]]
name = "build_runs"
path = "src/bin/build_runs.rs"

[[bin]]
name = "merge_index"
path = "src/bin/merge_index.rs"

[package.metadata.docs.rs]
no-default-features = true
