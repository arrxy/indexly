[package]
name = "search-engine"
version = "0.1.0"
edition = "2024"
default-run = "search-engine"

[dependencies]

[features]
default = ["gpu-sort"]
gpu-sort = ["dep:wgpu", "dep:bytemuck"]

[dependencies.wgpu]
version = "29.0.3"
optional = true
default-features = false
features = ["std", "metal", "wgsl"]

[dependencies.bytemuck]
version = "1.25.0"
optional = true
